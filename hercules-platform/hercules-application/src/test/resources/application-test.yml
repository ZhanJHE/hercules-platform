# 测试环境：H2 内存库（MySQL 兼容模式）+ 桩 L2 缓存，不依赖本机 MySQL/Redis
spring:
  datasource:
    url: jdbc:h2:mem:hercules;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

# 测试专用 JWT 密钥（仅 H2 冒烟/认证流测试使用）
hercules:
  auth:
    secret: "test-only-secret-for-hercules-jwt-signing-0123456789abcdef"
