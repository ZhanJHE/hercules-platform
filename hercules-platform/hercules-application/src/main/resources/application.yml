spring:
  application:
    name: hercules
  profiles:
    active: local
  sql:
    init:
      mode: always
  # ===== 高可用加固：全链路超时传递（阶段 A+）=====
  data:
    redis:
      timeout: 200ms          # Lettuce 命令超时（默认 60s！不设则 Redis 挂起会拖垮 Tomcat 线程池）
      connect-timeout: 500ms  # 建连超时
  datasource:
    hikari:
      maximum-pool-size: 20   # 配合 200 个 Tomcat 线程
      connection-timeout: 3000 # 池内获取连接最多等 3s，超时快速失败

server:
  port: 8080

# ===== 阶段 D：SSE 异步与 Security 的兼容配置 =====
# Security 过滤器链只在 REQUEST/ERROR 转发类型执行——SSE 的 ASYNC 转发不再重跑授权
# （自定义 JwtAuthenticationFilter 为 OncePerRequest，ASYNC 时被跳过会导致匿名 → 已提交响应上二次拒绝）。
# 无状态 JWT 场景下授权已在初始请求完成，异步续传无需重检。
spring.security.filter.dispatcher-types: request,error

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    default-statement-timeout: 3  # 所有 SQL 默认语句超时（秒），防慢查询占住连接与线程

# ===== 阶段 D：Spring AI（GLM OpenAI 兼容接入）=====
# api-key 经 application-local.yml / GLM_API_KEY 环境变量提供，勿提交
spring.ai:
  openai:
    base-url: https://open.bigmodel.cn/api/paas
    chat:
      completions-path: /v4/chat/completions
      options:
        model: glm-4.5-air
        temperature: 0.7
        # 思考型模型：thinking 与正文共享 token 预算，需留足正文余量（实测 1024 会被思考吃满致正文为空）
        max-tokens: 4096

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true   # HTTP 请求延迟直方图（Prometheus 侧可算 P95/P99，压测可视化用）

# ===== Hercules MVP 配置 =====
# 延后接入的中间件占位（阶段 C+）：
# milvus/neo4j: RAG 检索（阶段 E）
hercules:
  sync:
    transport: in-process  # 缓存同步触发源：in-process（默认，进程内总线）/ canal-mq（阶段 B：MySQL binlog → canal → RocketMQ → 消费者）
    node-id: node-1        # 本节点标识，用于向量时钟
    max-nodes: 10          # 向量时钟最大节点数（超限告警，对应风险 R-03）
    rocketmq:              # 仅 canal-mq 模式读取；容器部署经环境变量覆盖 name-server
      name-server: localhost:9876
      topic: hercules-binlog-topic
      consumer-group: hercules-cache-sync
  agent:                 # 阶段 D：多智能体编排参数
    model: glm-4.5-air   # 对话/推荐/意图兜底使用的模型（与 spring.ai.openai 同源）
    enabled: true        # 总开关（false 时 chat 端点返回固定降级提示）
    history-limit: 20    # 内存会话历史上限（轮）
    max-sessions: 500    # 内存会话数上限，达到上限淘汰最旧会话（历史/待确认/归属一并清除）
    # LLM 超时：glm-4.5-air 为思考型模型，首包 18~32s 波动（实测），过短会误杀正常生成
    timeout-seconds: 90
  auth:
    access-ttl: 30m        # Access Token（JWT）有效期
    refresh-ttl: 7d        # Refresh Token（Redis）有效期
    demo-student-count: 3  # 演示学生账号数 st001~st{N}（压测部署经环境变量调大）
    # secret 必须配置在 application-local.yml（gitignore，≥32 字节），缺失将拒绝启动
  loadtest:
    seed: false            # 压测数据播种开关（仅压测部署开启，见 LoadTestSeeder）
    course-count: 5000     # 压测课程目标数量（LOADTEST-* 前缀）
  cache:
    local-ttl: 60s         # Caffeine L1 固定 TTL
    remote-ttl: 300s       # Redis L2 详情键 TTL
    list-ttl: 10s          # 列表键 TTL（最终一致窗口）
    local-max-size: 1000
    ttl-override-cap: 4096 # 逐键 TTL 覆盖表容量上限（达上限先回收死键，仍超限才整体清空）
    list-key-prefix: "course:list:"
    # ===== 高可用加固：击穿防护与熔断（阶段 A+）=====
    circuit-breaker:
      enabled: true        # Redis 熔断装饰器开关
    load-lock:
      enabled: true        # 分布式回源锁开关（Redis 不可用时自动跳过）
      ttl: 3s              # 回源锁持有时长（SET NX PX）
      poll-interval: 50ms  # 未抢到锁时探测 L2 的间隔
      poll-budget: 2s      # 未抢到锁时等待队长的总预算，超时走安全阀自己回源
