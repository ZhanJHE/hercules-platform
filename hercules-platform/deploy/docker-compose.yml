# Hercules 部署编排（WSL2 + Docker Desktop，阶段 H-3）
# 镜像加速：DOCKER_MIRROR 可换源重试（daocloud → 1ms → ...）；secret/密码为开发环境值，生产经 .env 注入
services:
  mysql:
    image: ${DOCKER_MIRROR:-docker.m.daocloud.io}/library/mysql:8.0
    container_name: hercules-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --binlog-format=ROW          # 阶段 B：Canal/嵌入式 Binlog 连接器前置条件
      - --log-bin=mysql-bin
      - --server-id=1
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot123"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: ${DOCKER_MIRROR:-docker.m.daocloud.io}/library/redis:7-alpine
    container_name: hercules-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    image: hercules-app:dev
    build:
      context: ..
      dockerfile: Dockerfile-app
      args:
        BASE_IMAGE: ${DOCKER_MIRROR:-docker.m.daocloud.io}/library/eclipse-temurin:21-jre
    container_name: hercules-app
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/hercules?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root123
      SPRING_DATA_REDIS_HOST: redis
      HERCULES_AUTH_SECRET: ***REDACTED-JWT-SECRET***
      HERCULES_AUTH_DEMO_STUDENT_COUNT: "60"     # 压测登录账号池 st001~st060
      HERCULES_LOADTEST_SEED: "true"             # 启动时播种 5000 门压测课程
      HERCULES_LOADTEST_COURSE_COUNT: "5000"
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "40"   # 阶段H-4压测实证：20连接在150写并发下饱和(waiting=116)
      # JVM 显式调优（阶段H-4调研）：默认自适应为 Xms250M/Xmx4G——起步过小、上限过大；G1 保留+暂停目标；GC 日志供论文取证
      JAVA_TOOL_OPTIONS: "-Xms1g -Xmx2g -XX:+AlwaysPreTouch -XX:MaxGCPauseMillis=50 -Xlog:gc*:file=/app/logs/gc.log:time,uptime:filecount=5,filesize=20m"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"                  # 直连调试用（压测经网关 8081）
    mem_limit: 3g                    # JVM(2g堆)+元空间+堆外+线程栈的预算上限，隔离与 gateway/MySQL 的邻居效应
    volumes:
      - hercules-app-logs:/app/logs  # 日志落盘（logback 滚动文件 + 认证审计）
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 40s

  gateway:
    image: hercules-gateway:dev
    build:
      context: ..
      dockerfile: Dockerfile-gateway
      args:
        BASE_IMAGE: ${DOCKER_MIRROR:-docker.m.daocloud.io}/library/eclipse-temurin:21-jre
    container_name: hercules-gateway
    environment:
      APP_URI: http://app:8080
      HERCULES_AUTH_SECRET: ***REDACTED-JWT-SECRET***
      # 轻量网关：默认自适应 Xmx4G 纯属浪费，显式收小（阶段H-4调研）
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx512m -XX:+AlwaysPreTouch -Xlog:gc*:file=/app/logs/gc.log:time,uptime:filecount=3,filesize=10m"
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "8081:8081"                  # 压测入口（经网关）
      - "8082:8082"                  # 网关管理端口（健康/指标）
    mem_limit: 1g                    # 网关轻量（路由+JWT），512m 堆 + 元空间/堆外余量
    volumes:
      - hercules-gateway-logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8082'"]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 30s

  prometheus:
    image: ${DOCKER_MIRROR:-docker.m.daocloud.io}/prom/prometheus:latest
    container_name: hercules-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - app
      - gateway

  grafana:
    image: ${DOCKER_MIRROR:-docker.m.daocloud.io}/grafana/grafana:latest
    container_name: hercules-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin123   # 演示环境默认口令，生产必须更换
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  mysql-data:
  hercules-app-logs:
  hercules-gateway-logs:
