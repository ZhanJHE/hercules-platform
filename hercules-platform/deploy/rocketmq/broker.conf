# RocketMQ Broker 配置（阶段 B，单机开发口径）
brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
# 每天凌晨 4 点清理过期消息
deleteWhen = 04
# 保留 48 小时
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH
# 容器网络内以服务名注册，客户端经 Docker DNS 解析
brokerIP1 = rocketmq-broker
listenPort = 10911
# 开发环境自动建 topic（hercules-binlog-topic 由 canal 首次投递时创建）
autoCreateTopicEnable = true
